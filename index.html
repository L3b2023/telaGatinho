<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estamos fora do ar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#0d2342;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
    padding:40px;
}

main{
    max-width:600px;
    width:100%;
}

@keyframes wobble {
    0%,100% { transform: rotate(0deg); }
    20%      { transform: rotate(-6deg); }
    40%      { transform: rotate(6deg); }
    60%      { transform: rotate(-4deg); }
    80%      { transform: rotate(4deg); }
}

img{
    width:min(260px, 60vw);
    margin-bottom:30px;
    animation: wobble 2.5s ease-in-out infinite;
    transform-origin: bottom center;
}

h1{
    font-size:clamp(2rem, 8vw, 4rem);
    font-weight:600;
    margin-bottom:15px;
}

p{
    font-size:clamp(1rem, 4vw, 1.2rem);
    color:#c6d3e6;
    line-height:1.6;
}
</style>
</head>

<body>

<main>

    <img src="/cat.png" alt="Gatinho">

    <h1>Estamos fora do ar.</h1>

    <p>
        Estamos realizando uma manutenção para melhorar nossos serviços.
        Em breve o site estará disponível novamente.
    </p>

</main>

</body>
</html>
