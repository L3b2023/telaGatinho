<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#0d2342;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
    padding:40px;
}

main{
    max-width:600px;
}

img{
    width:320px;
    margin-bottom:30px;
}

h1{
    font-size:4rem;
    font-weight:600;
    margin-bottom:15px;
}

p{
    font-size:1.2rem;
    color:#c6d3e6;
    line-height:1.6;
    margin-bottom:30px;
}

a{
    display:inline-block;
    margin-top:10px;
    padding:12px 28px;
    background:#1a4a7a;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-size:1rem;
    transition:background 0.2s;
}

a:hover{
    background:#2060a0;
}
</style>
</head>

<body>

<main>

    <img src="cat.png" alt="Gatinho">

    <h1>Página não encontrada.</h1>

    <p>
        Essa página não existe ou foi removida.<br>
        Volte para o início e encontre o que precisa.
    </p>

    <a href="/">Voltar para o início</a>

</main>

</body>
</html>
